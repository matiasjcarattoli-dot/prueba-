<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Último Turno: Sabor Amargo</title>
<meta name="description" content="Juego de roles ocultos y sabotaje en la final de un reality de cocina. De 2 a 10 jugadores, con un solo celular.">
<meta name="theme-color" content="#140a07">
<meta property="og:title" content="Último Turno: Sabor Amargo">
<meta property="og:description" content="Roles ocultos, sabotaje y alta cocina. De 2 a 10 jugadores pasándose el celu.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#140a07;--card:#24140e;--card2:#2f1b13;--line:#4a2c1f;--txt:#f7ece4;--mut:#c2a898;--acc:#ff8a3d;--acc2:#ffb267;--ok:#7bd84a;--bad:#ff5a5a;--sab:#b35cff;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% 0,#3a1d14 0,var(--bg) 70%) fixed}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;line-height:1.1;margin:8px 0 4px}h2{font-size:22px;margin:4px 0 12px}h3{font-size:17px;margin:16px 0 8px}
p{margin:6px 0}.mut{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font:600 17px system-ui;color:#1d0d06;background:linear-gradient(180deg,var(--acc2),var(--acc));cursor:pointer;margin:10px 0}
.btn:disabled{opacity:.4}.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin:4px 0}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.dock .btn{max-width:528px;margin:0 auto}
input[type=text]{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px;max-width:100%}
.row{display:flex;gap:8px;align-items:center}.row>.grow{flex:1}
.x{background:none;border:0;color:var(--mut);font-size:22px;padding:4px 8px;cursor:pointer}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:2px 2px 0 0}
.tag.sab{background:#3b1a55;border-color:var(--sab);color:#e6c8ff}.tag.ok{background:#1f3a12;border-color:var(--ok);color:#d4ffb8}.tag.bad{background:#4a1515;border-color:var(--bad);color:#ffd0d0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ing{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;user-select:none}
.ing .e{font-size:30px;line-height:1.1}.ing .n{font-size:13px;margin-top:2px}.ing .v{font-size:12px;color:var(--acc2)}
.ing.on{border-color:var(--acc);background:#4a2414}
.tool{display:flex;gap:10px;align-items:flex-start}.tool .e{font-size:30px}
.big{font-size:56px;text-align:center;margin:8px 0}
.hero{text-align:center;padding:30px 10px}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--acc),var(--ok))}
.score{font:800 28px system-ui;min-width:46px;text-align:right}
.stars{font-size:28px;letter-spacing:4px;text-align:center}
.ev{font-size:14px;padding:3px 0;color:var(--mut)}
.pill{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card2);margin:6px 0;cursor:pointer;border:2px solid transparent}
.pill.on{border-color:var(--acc)}
.timer{position:sticky;top:0;z-index:2;text-align:center;font-weight:700;padding:6px;border-radius:10px;background:var(--card2);margin-bottom:8px}
.timer.low{background:#5a1a1a}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.toggle input{width:22px;height:22px}
details summary{cursor:pointer;font-weight:600}
.secret{background:repeating-linear-gradient(45deg,#2a1610,#2a1610 10px,#24140e 10px,#24140e 20px)}
.top{display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:#000c;z-index:9;overflow:auto;padding:20px 16px}
.modal .card{max-width:528px;margin:10px auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ───────── Datos del juego ─────────
const ING = {
  tomate:['Tomate','🍅',2,['vegetal','acido']], albahaca:['Albahaca','🌿',1,['vegetal']], palta:['Palta','🥑',2,['vegetal']],
  papa:['Papa','🥔',1,['vegetal']], hongos:['Hongos','🍄',2,['vegetal']], ajo:['Ajo','🧄',1,['vegetal']],
  romero:['Romero','🌱',1,['vegetal']], limon:['Limón','🍋',1,['acido']], pera:['Pera','🍐',2,['dulce']],
  frutillas:['Frutillas','🍓',2,['dulce','acido']], banana:['Banana','🍌',1,['dulce']], chocolate:['Chocolate','🍫',3,['dulce']],
  ddl:['Dulce de leche','🍮',3,['dulce','lacteo']], miel:['Miel','🍯',1,['dulce']], manteca:['Manteca','🧈',1,['lacteo']],
  queso:['Queso azul','🧀',2,['lacteo']], crema:['Crema','🥛',1,['lacteo']], salmon:['Salmón','🐟',3,['proteina']],
  bife:['Bife','🥩',3,['proteina']], langostinos:['Langostinos','🦐',3,['proteina']], cordero:['Cordero','🍖',3,['proteina']],
  pollo:['Pollo','🍗',2,['proteina']], huevo:['Huevo','🥚',1,['proteina']], chimi:['Chimichurri','🫙',2,['salsa']],
  vino:['Salsa de vino','🍷',2,['salsa']]
};
const PAIRS = [
  ['tomate','albahaca','Caprese criolla'],['salmon','limon','Salmón cítrico'],['bife','chimi','Bife con chimi'],
  ['chocolate','frutillas','Frutillas bañadas'],['papa','manteca','Puré sedoso'],['queso','pera','Pera y queso azul'],
  ['ddl','banana','Banana split'],['hongos','ajo','Hongos al ajillo'],['langostinos','palta','Cóctel de langostinos'],
  ['cordero','romero','Cordero al romero'],['pollo','vino','Pollo al vino'],['huevo','papa','Tortilla'],
  ['crema','frutillas','Frutillas con crema'],['miel','queso','Queso con miel']
];
const COURSES = [
  {name:'Entrada',emoji:'🥗',theme:'Fresco y liviano',rule:'+1 por cada ingrediente vegetal o ácido',
   bonus:t=>(t.includes('vegetal')||t.includes('acido'))?1:0},
  {name:'Plato principal',emoji:'🍽️',theme:'Contundente',rule:'+1 por cada proteína o salsa',
   bonus:t=>(t.includes('proteina')||t.includes('salsa'))?1:0},
  {name:'Postre',emoji:'🍰',theme:'Final dulce',rule:'+1 por cada dulce o lácteo · −1 por cada proteína',
   bonus:t=>((t.includes('dulce')||t.includes('lacteo'))?1:0)-(t.includes('proteina')?1:0)}
];
const CARDS = {
  salero:{name:'Salero Táctico',e:'🧂',neg:true,desc:'−3 al plato de un rival.'},
  aji:{name:'Ají del Infierno',e:'🌶️',neg:true,desc:'−2 al plato de un rival y anula las Trufas que reciba esta ronda.'},
  cuchillo:{name:'Cuchillo Santoku',e:'🔪',neg:true,desc:'Le robás su mejor ingrediente: pierde ese valor y vos ganás +2.'},
  extintor:{name:'Extintor de Emergencia',e:'🧯',self:true,desc:'Protege una estación (la tuya o la de otro): bloquea el primer ataque que reciba.'},
  trufa:{name:'Toque de Trufa',e:'✨',self:true,desc:'+2 a cualquier plato (incluido el tuyo).'},
  lupa:{name:'Lupa',e:'🔍',desc:'En la votación vas a ver en secreto qué hizo ese chef esta ronda.'}
};
const CHARS = {
  sommelier:{name:'Sommelier',e:'🍷',desc:'Los maridajes te dan +3 en vez de +2.'},
  pastelero:{name:'Pastelero',e:'🧁',desc:'Inmune al Salero Táctico.'},
  souschef:{name:'Sous Chef',e:'👨‍🍳',desc:'Tu despensa trae 2 ingredientes extra para elegir.'},
  lavaplatos:{name:'Lavaplatos Veterano',e:'🧽',desc:'Cada ronda recibís un Extintor extra.'},
  parrillero:{name:'Parrillero',e:'🔥',desc:'+1 por cada proteína de tu plato.'},
  molecular:{name:'Chef Molecular',e:'🧪',desc:'Tus Toques de Trufa dan +3.'},
  critico:{name:'Crítico Infiltrado',e:'📝',desc:'Tu voto vale doble.',roles:true},
  inspector:{name:'Inspector de Sanidad',e:'🕵️',desc:'Una vez por partida, en la votación, ves quiénes te atacaron esa ronda.',roles:true}
};
const ROUNDS = 3, STARS_NEEDED = 2, STAR_AVG = 7, TURN_SECS = 75, DEBATE_SECS = 120;

// ───────── Utilidades ─────────
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const KEY = 'saborAmargo.v1', NAMES_KEY = 'saborAmargo.names';
let G = null, ui = {}, tick = null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} };
const name = i => esc(G.players[i].name);
const isRoles = () => G.mode === 'roles';
const sabCount = n => n >= 9 ? 3 : n >= 7 ? 2 : 1;
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ───────── Lógica ─────────
function newGame(names, timed) {
  const n = names.length, mode = n >= 5 ? 'roles' : 'duel';
  const pool = Object.keys(CHARS).filter(k => mode === 'roles' || !CHARS[k].roles);
  let chars = []; while (chars.length < n) chars = chars.concat(shuffle(pool));
  const sabs = mode === 'roles' ? shuffle([...Array(n).keys()]).slice(0, sabCount(n)) : [];
  G = { mode, timed, round: 0, stars: [], chaos: 0, phase: 'roles', idx: 0, hand: true, history: [],
    players: names.map((nm, i) => ({ name: nm, char: chars[i], role: sabs.includes(i) ? 'sab' : 'leal', caught: false,
      total: 0, scores: [], ghost: false, ability: false })) };
  save();
}
const order = () => { const n = G.players.length, s = G.round % n; return [...Array(n).keys()].map(k => (k + s) % n); };

function startRound() {
  const n = G.players.length;
  G.turn = { pantry: [], hands: [], picks: [], actions: [], gifts: [] };
  for (let i = 0; i < n; i++) {
    const p = G.players[i];
    // Despensa: al menos un maridaje garantizado
    const pr = pick(PAIRS), size = p.char === 'souschef' ? 9 : 7;
    const rest = shuffle(Object.keys(ING).filter(k => k !== pr[0] && k !== pr[1])).slice(0, size - 2);
    G.turn.pantry[i] = shuffle([pr[0], pr[1], ...rest]);
    // Herramientas
    let deck, count;
    if (!isRoles()) { deck = ['salero', 'aji', 'cuchillo', 'extintor', 'trufa']; count = 2; }
    else if (p.role === 'sab' && !p.caught) { deck = ['salero','salero','salero','aji','aji','aji','cuchillo','cuchillo','extintor','trufa','lupa']; count = 3; }
    else { deck = ['extintor','extintor','extintor','trufa','trufa','trufa','lupa','lupa','lupa','cuchillo']; count = 2; }
    const h = []; for (let k = 0; k < count; k++) h.push(pick(deck));
    if (p.char === 'lavaplatos') h.push('extintor');
    G.turn.hands[i] = h; G.turn.picks[i] = []; G.turn.actions[i] = []; G.turn.gifts[i] = null;
  }
  G.phase = 'turns'; G.idx = 0; G.hand = true; save();
}
const maxUses = i => (isRoles() && G.players[i].role === 'sab' && !G.players[i].caught) ? 2 : 1;

function baseScore(i, picks) {
  const p = G.players[i], c = COURSES[G.round];
  let s = 0, notes = [];
  for (const id of picks) {
    const [nm, , v, t] = ING[id]; s += v + c.bonus(t);
    if (p.char === 'parrillero' && t.includes('proteina')) s += 1;
  }
  for (const [a, b, nm] of PAIRS) if (picks.includes(a) && picks.includes(b)) {
    const bonus = p.char === 'sommelier' ? 3 : 2; s += bonus; notes.push(`${nm} (+${bonus})`);
  }
  return { s, notes };
}

function resolve() {
  const n = G.players.length, T = G.turn, dish = [], events = [], shield = Array(n).fill(0), noTrufa = Array(n).fill(false);
  const all = []; // {a, card, t}
  for (let a = 0; a < n; a++) for (const x of T.actions[a]) all.push({ a, card: x.card, t: x.t });
  const notes = [];
  for (let i = 0; i < n; i++) { const b = baseScore(i, T.picks[i]); dish[i] = clamp(b.s, 0, 10); notes[i] = b.notes; }
  const prio = { extintor: 0, lupa: 0, cuchillo: 1, salero: 1, aji: 1, trufa: 2 };
  all.sort((x, y) => prio[x.card] - prio[y.card]);
  const log = (t, txt) => events.push({ t, txt });
  for (const x of all) {
    const C = CARDS[x.card], tp = G.players[x.t];
    if (x.card === 'lupa') continue;
    if (x.card === 'extintor') { shield[x.t]++; continue; }
    if (C.neg) {
      if (x.card === 'salero' && tp.char === 'pastelero') { log(x.t, `🧂 Le tiraron Salero Táctico… ¡pero el Pastelero ni se inmutó!`); continue; }
      if (shield[x.t] > 0) { shield[x.t]--; log(x.t, `🧯 Un Extintor bloqueó ${C.e} ${C.name}.`); continue; }
      if (x.card === 'salero') { dish[x.t] -= 3; log(x.t, `🧂 Salero Táctico: −3`); }
      if (x.card === 'aji') { dish[x.t] -= 2; noTrufa[x.t] = true; log(x.t, `🌶️ Ají del Infierno: −2`); }
      if (x.card === 'cuchillo') {
        const best = Math.max(0, ...T.picks[x.t].map(id => ING[id][2]));
        dish[x.t] -= best; dish[x.a] += 2; log(x.t, `🔪 Le robaron un ingrediente: −${best}`); log(x.a, `🔪 Ingrediente robado: +2`);
      }
    }
    if (x.card === 'trufa') {
      if (noTrufa[x.t]) { log(x.t, `✨ Una Trufa se quemó con el ají: +0`); continue; }
      const v = G.players[x.a].char === 'molecular' ? 3 : 2; dish[x.t] += v; log(x.t, `✨ Toque de Trufa: +${v}`);
    }
  }
  for (let a = 0; a < n; a++) if (T.gifts[a] != null) { dish[T.gifts[a]] += 1; log(T.gifts[a], `👻 Un Crítico Fantasma sumó +1`); }
  for (let i = 0; i < n; i++) dish[i] = clamp(dish[i], 0, 10);
  // Intel secreta para la votación
  const intel = Array(n).fill(null).map(() => []);
  for (const x of all) if (x.card === 'lupa') {
    const did = all.filter(y => y.a === x.t);
    intel[x.a].push(`🔍 ${name(x.t)} ` + (did.length ? did.map(y => `usó ${CARDS[y.card].e} ${CARDS[y.card].name} sobre ${y.t === x.t ? 'sí mismo' : name(y.t)}`).join(', ') : 'no usó herramientas') + '.');
  }
  const attackers = Array(n).fill(null).map(() => []);
  for (const x of all) if (CARDS[x.card].neg && x.a !== x.t) attackers[x.t].push(x.a);
  // Puntajes y estrella
  G.players.forEach((p, i) => { p.scores.push(dish[i]); p.total += dish[i]; p.ghost = dish[i] <= 3; });
  let avg = null, star = null;
  if (isRoles()) {
    const counted = G.players.map((p, i) => i).filter(i => !(G.players[i].role === 'sab' && G.players[i].caught));
    avg = counted.reduce((s, i) => s + dish[i], 0) / counted.length - G.chaos;
    star = avg >= STAR_AVG; G.stars.push(star);
  }
  G.res = { dish, events, notes, avg, star, chaos: G.chaos, intel, attackers };
  G.chaos = 0;
  G.phase = 'results'; save();
}

function tallyVotes() {
  const n = G.players.length, count = Array(n).fill(0);
  G.votes.forEach((v, i) => { if (v != null) count[v] += G.players[i].char === 'critico' ? 2 : 1; });
  const max = Math.max(...count), top = count.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  const accused = max > 0 && top.length === 1 ? top[0] : null;
  let verdict = 'none';
  if (accused != null) {
    if (G.players[accused].role === 'sab') { G.players[accused].caught = true; verdict = 'sab'; }
    else { verdict = 'leal'; G.chaos = 1; }
  }
  G.vote = { count, accused, verdict }; G.phase = 'verdict'; save();
}
const allCaught = () => G.players.every(p => p.role !== 'sab' || p.caught);
function nextRound() {
  if (isRoles() && allCaught()) { G.win = 'leal'; G.why = '¡Desenmascararon a todos los saboteadores!'; G.phase = 'end'; save(); return; }
  if (G.round + 1 >= ROUNDS) {
    if (isRoles()) {
      const st = G.stars.filter(Boolean).length;
      G.win = st >= STARS_NEEDED ? 'leal' : 'sab';
      G.why = st >= STARS_NEEDED ? `La cocina consiguió ${st} estrella${st > 1 ? 's' : ''} Michelin.` : `Solo ${st} estrella${st === 1 ? '' : 's'}: el menú quedó con sabor amargo.`;
    }
    G.phase = 'end'; save(); return;
  }
  G.round++; startRound();
}

// ───────── Render ─────────
function render() {
  clearInterval(tick); tick = null;
  const app = $('#app');
  if (!G) return app.innerHTML = vSetup();
  const v = { roles: vRoles, turns: vTurns, results: vResults, debate: vDebate, vote: vVote, verdict: vVerdict, end: vEnd }[G.phase];
  app.innerHTML = v();
  if (G.phase === 'turns' && !G.hand) updatePreview();
  scrollTo(0, 0);
}
const dock = (label, act, extra = '') => `<div class="dock"><button class="btn" data-act="${act}" ${extra}>${label}</button></div>`;
const header = () => `<div class="top"><span class="mut small">${COURSES[G.round].emoji} Ronda ${G.round + 1}/${ROUNDS} · ${COURSES[G.round].name}</span><button class="x" data-act="menu" aria-label="Menú">⋯</button></div>`;
const handoff = (i, sub) => `<div class="hero"><div class="big">📱</div><p class="mut">Pasale el celu a</p><h1>${name(i)}</h1><p class="mut">${sub}</p></div>
  <div class="card secret center mut">Que nadie más mire la pantalla 👀</div>${dock(`Soy ${name(i)}, mostrar`, 'reveal')}`;

function vSetup() {
  if (!ui.names) { try { ui.names = JSON.parse(localStorage.getItem(NAMES_KEY)) || ['', '', '']; } catch (e) { ui.names = ['', '', '']; } }
  if (ui.timed == null) ui.timed = true;
  let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const n = ui.names.filter(s => s.trim()).length, mode = n >= 5 ? 'roles' : 'duel';
  return `<div class="hero" style="padding-bottom:8px"><img src="icons/icon.svg" width="88" height="88" alt=""><h1>Último Turno:<br>Sabor Amargo</h1>
    <p class="mut">La final de un reality de cocina. Algunos chefs vinieron a ganar… y otros, a arruinarlo todo.</p></div>
    ${saved && saved.phase !== 'end' ? `<button class="btn" data-act="resume">Continuar partida (ronda ${saved.round + 1})</button>` : ''}
    <div class="card"><h3 style="margin-top:0">Chefs (2 a 10)</h3>
    ${ui.names.map((s, i) => `<div class="row" style="margin:6px 0"><input type="text" class="grow" maxlength="14" placeholder="Jugador ${i + 1}" value="${esc(s)}" data-name="${i}">${ui.names.length > 2 ? `<button class="x" data-act="del" data-i="${i}" aria-label="Quitar">×</button>` : ''}</div>`).join('')}
    ${ui.names.length < 10 ? `<button class="btn sec sm" data-act="add">+ Agregar chef</button>` : ''}
    <div class="toggle"><label for="timed">Turnos con reloj (${TURN_SECS} s)</label><input type="checkbox" id="timed" ${ui.timed ? 'checked' : ''}></div>
    <p class="small mut" id="modeinfo">${modeInfo(n, mode)}</p></div>
    <button class="btn sec" data-act="rules">📖 Cómo se juega</button>
    ${dock('Empezar partida', 'start', n < 2 ? 'disabled' : '')}`;
}
function modeInfo(n, mode) {
  if (n < 2) return 'Cargá al menos 2 nombres.';
  return mode === 'roles' ? `<b>Modo Roles Ocultos</b>: ${n} chefs, ${sabCount(n)} saboteador${sabCount(n) > 1 ? 'es' : ''} infiltrado${sabCount(n) > 1 ? 's' : ''}. Hay votación después de cada plato.`
    : `<b>Modo Duelo de Alta Cocina</b>: todos contra todos. Gana el que sume más puntos en los 3 platos. (Con 5 o más se activan los roles ocultos.)`;
}

function vRoles() {
  const i = G.idx, p = G.players[i], ch = CHARS[p.char];
  if (G.hand) return handoff(i, 'Vas a ver tu personaje secreto.');
  let role = '';
  if (isRoles()) {
    if (p.role === 'sab') {
      const mates = G.players.map((q, j) => j).filter(j => j !== i && G.players[j].role === 'sab');
      role = `<div class="card" style="border-color:var(--sab)"><span class="tag sab">Saboteador</span><h2>Arruiná el menú sin que te descubran</h2>
        <p>Si la cocina no consigue ${STARS_NEEDED} estrellas en ${ROUNDS} platos, ganan los saboteadores. Recibís más herramientas y podés usar 2 por turno.</p>
        ${mates.length ? `<p>Tu cómplice${mates.length > 1 ? 's' : ''}: <b>${mates.map(name).join(', ')}</b></p>` : '<p class="mut">Trabajás solo.</p>'}</div>`;
    } else role = `<div class="card" style="border-color:var(--ok)"><span class="tag ok">Chef Leal</span><h2>Cociná el menú perfecto</h2>
        <p>Consigan ${STARS_NEEDED} estrellas (promedio de los platos ≥ ${STAR_AVG}) o desenmascaren a todos los saboteadores.</p></div>`;
  } else role = `<div class="card"><span class="tag">Duelo</span><h2>Todos contra todos</h2><p>Sumá la mayor cantidad de puntos en los ${ROUNDS} platos. Sabotear está permitido… y recomendado.</p></div>`;
  return `<p class="mut center">Tu identidad secreta</p><div class="big">${ch.e}</div><h1 class="center">${ch.name}</h1><p class="center">${ch.desc}</p>${role}
    ${dock('Entendido, ocultar', 'next')}`;
}

function vTurns() {
  const ord = order(), i = ord[G.idx], p = G.players[i], T = G.turn, c = COURSES[G.round];
  if (G.hand) return header() + handoff(i, `Turno ${G.idx + 1} de ${ord.length} · ${c.emoji} ${c.name}`);
  if (G.timed) startTimer();
  const others = G.players.map((q, j) => j).filter(j => j !== i);
  const opts = (card) => (CARDS[card].self ? [i, ...others] : others).map(j => `<option value="${j}">${j === i ? 'Mi estación' : name(j)}</option>`).join('');
  const mates = isRoles() && p.role === 'sab' ? G.players.map((q, j) => j).filter(j => j !== i && G.players[j].role === 'sab') : [];
  return `${G.timed ? `<div class="timer" id="timer">⏱ ${ui.left}s</div>` : ''}${header()}
    <div class="row"><span style="font-size:34px">${CHARS[p.char].e}</span><div class="grow"><b>${name(i)}</b> · ${CHARS[p.char].name}<br>
      <span class="small mut">${CHARS[p.char].desc}</span></div>${isRoles() ? `<span class="tag ${p.role === 'sab' ? 'sab' : 'ok'}">${p.role === 'sab' ? (p.caught ? 'Descubierto' : 'Saboteador') : 'Leal'}</span>` : ''}</div>
    ${mates.length ? `<p class="small mut">Cómplice${mates.length > 1 ? 's' : ''}: ${mates.map(name).join(', ')}</p>` : ''}
    <div class="card"><h3 style="margin-top:0">${c.emoji} ${c.name}: “${c.theme}”</h3><p class="small mut">${c.rule} · Maridaje: +${p.char === 'sommelier' ? 3 : 2}</p>
      <p class="small">Elegí <b>3 ingredientes</b> de tu despensa:</p>
      <div class="grid">${T.pantry[i].map(id => { const [nm, e, v] = ING[id]; return `<div class="ing ${T.picks[i].includes(id) ? 'on' : ''}" data-act="ing" data-id="${id}"><div class="e">${e}</div><div class="n">${nm}</div><div class="v">${'★'.repeat(v)}</div></div>`; }).join('')}</div>
      <p id="preview" class="small" style="margin-top:10px"></p>
      <details class="small mut"><summary>Maridajes posibles</summary>${PAIRS.map(([a, b, nm]) => `${ING[a][1]}+${ING[b][1]} ${nm}`).join(' · ')}</details></div>
    <div class="card"><h3 style="margin-top:0">🧰 Herramientas <span class="small mut">(usá hasta ${maxUses(i)})</span></h3>
      ${T.hands[i].map((card, k) => { const C = CARDS[card], used = T.actions[i].find(x => x.k === k);
        return `<div class="tool" style="margin:10px 0"><span class="e">${C.e}</span><div class="grow"><b>${C.name}</b><br><span class="small mut">${C.desc}</span>
          <div class="row" style="margin-top:6px"><select data-tool="${k}"><option value="">No usar</option>${opts(card)}</select></div></div></div>`; }).join('')}
      <p class="small mut" id="toolwarn"></p></div>
    ${p.ghost && G.round > 0 ? `<div class="card"><h3 style="margin-top:0">👻 Crítico Fantasma</h3><p class="small mut">Tu plato anterior quedó arruinado, así que podés regalarle +1 a otro chef.</p>
      <select data-gift><option value="">Nadie</option>${others.map(j => `<option value="${j}">${name(j)}</option>`).join('')}</select></div>` : ''}
    ${dock('Servir plato 🍽️', 'serve', 'disabled')}`;
}
function updatePreview() {
  const ord = order(), i = ord[G.idx], T = G.turn, picks = T.picks[i];
  // restaurar selects
  T.actions[i].forEach(x => { const s = document.querySelector(`[data-tool="${x.k}"]`); if (s) s.value = x.t; });
  const g = document.querySelector('[data-gift]'); if (g && T.gifts[i] != null) g.value = T.gifts[i];
  const b = baseScore(i, picks), pv = $('#preview');
  if (pv) pv.innerHTML = picks.length ? `Puntaje base: <b>${clamp(b.s, 0, 10)}</b>/10 ${b.notes.length ? '· 🍷 ' + b.notes.join(', ') : ''} <span class="mut">(${picks.length}/3)</span>` : '<span class="mut">Todavía no elegiste nada.</span>';
  const over = T.actions[i].length > maxUses(i);
  $('#toolwarn').textContent = over ? `Solo podés usar ${maxUses(i)} herramienta${maxUses(i) > 1 ? 's' : ''} por turno.` : '';
  const btn = document.querySelector('[data-act="serve"]'); if (btn) btn.disabled = picks.length !== 3 || over;
}
function startTimer() {
  if (ui.timerFor !== `${G.round}-${G.idx}`) { ui.timerFor = `${G.round}-${G.idx}`; ui.left = TURN_SECS; }
  tick = setInterval(() => {
    ui.left--; const el = $('#timer'); if (el) { el.textContent = `⏱ ${ui.left}s`; el.classList.toggle('low', ui.left <= 10); }
    if (ui.left === 10) vibrate(200);
    if (ui.left <= 0) { clearInterval(tick); autoServe(); }
  }, 1000);
}
function autoServe() {
  const ord = order(), i = ord[G.idx], T = G.turn;
  for (const id of shuffle(T.pantry[i])) if (T.picks[i].length < 3 && !T.picks[i].includes(id)) T.picks[i].push(id);
  T.actions[i] = T.actions[i].slice(0, maxUses(i));
  vibrate([100, 50, 100]); serve();
}
function serve() {
  ui.timerFor = null;
  if (G.idx + 1 < G.players.length) { G.idx++; G.hand = true; save(); render(); }
  else { resolve(); render(); }
}

function vResults() {
  const R = G.res, ord = [...G.players.keys()].sort((a, b) => R.dish[b] - R.dish[a]);
  const last = G.round + 1 >= ROUNDS;
  return `${header()}<h2 class="center">🔔 ¡Platos a la mesa!</h2>
    ${isRoles() ? `<div class="card center"><div class="stars">${starRow()}</div>
      <p>Promedio de la cocina: <b>${R.avg.toFixed(1)}</b>${R.chaos ? ' <span class="small mut">(incluye −1 por el caos de la ronda anterior)</span>' : ''} · objetivo ${STAR_AVG}</p>
      <p>${R.star ? '⭐ ¡Ganaron una estrella Michelin!' : '💀 Sin estrella esta ronda.'}</p></div>` : ''}
    ${ord.map(i => { const p = G.players[i], ev = R.events.filter(e => e.t === i);
      return `<div class="card"><div class="row"><div class="grow"><b>${name(i)}</b> ${isRoles() && p.caught ? '<span class="tag sab">Saboteador descubierto</span>' : ''}<br>
        <span style="font-size:22px">${G.turn.picks[i].map(id => ING[id][1]).join(' ')}</span>
        ${R.notes[i].length ? `<span class="small mut"> · ${R.notes[i].join(', ')}</span>` : ''}</div><div class="score">${R.dish[i]}</div></div>
        <div class="bar"><i style="width:${R.dish[i] * 10}%"></i></div>${ev.map(e => `<div class="ev">${e.txt}</div>`).join('')}</div>`; }).join('')}
    ${!isRoles() ? `<div class="card"><h3 style="margin-top:0">Tabla</h3>${standings()}</div>` : ''}
    ${isRoles() ? dock('Debatir y votar 🗣️', 'debate') : dock(last ? 'Ver al campeón 🏆' : 'Siguiente plato →', 'nextround')}`;
}
const starRow = () => [...Array(ROUNDS).keys()].map(k => k < G.stars.length ? (G.stars[k] ? '⭐' : '💀') : '◻️').join('');
const standings = () => [...G.players.keys()].sort((a, b) => G.players[b].total - G.players[a].total)
  .map((i, r) => `<div class="row" style="padding:4px 0"><span class="grow">${['🥇', '🥈', '🥉'][r] || '·'} ${name(i)}</span><span class="small mut">${G.players[i].scores.join(' + ')}</span><b style="min-width:32px;text-align:right">${G.players[i].total}</b></div>`).join('');

function vDebate() {
  if (ui.debate == null) ui.debate = DEBATE_SECS;
  tick = setInterval(() => { ui.debate--; const el = $('#deb'); if (el) el.textContent = fmt(Math.max(0, ui.debate)); if (ui.debate === 0) vibrate([200, 100, 200]); }, 1000);
  return `${header()}<div class="hero"><div class="big">🗣️</div><h1>Debate en la cocina</h1>
    <p class="mut">Miren los platos y los ataques. ¿Quién tiró el salero? ¿Quién usó la lupa y qué vio? Acusen, defiéndanse, mientan.</p>
    <div style="font:800 54px system-ui;margin:16px 0" id="deb">${fmt(Math.max(0, ui.debate))}</div>
    <p class="small mut">Después cada uno vota en secreto pasándose el celu. Si hay empate, nadie es acusado.</p></div>
    ${dock('Pasar a la votación 🗳️', 'tovote')}`;
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function vVote() {
  const i = G.idx, p = G.players[i];
  if (G.hand) return header() + handoff(i, `Votación secreta · ${i + 1} de ${G.players.length}`);
  const cand = G.players.map((q, j) => j).filter(j => j !== i && !(G.players[j].role === 'sab' && G.players[j].caught));
  const intel = G.res.intel[i];
  const canInspect = p.char === 'inspector' && !p.ability;
  return `${header()}<h2>🗳️ ¿Quién es el saboteador?</h2><p class="small mut">${name(i)}, tu voto es secreto.${p.char === 'critico' ? ' Como Crítico Infiltrado, vale doble.' : ''}</p>
    ${intel.length ? `<div class="card" style="border-color:var(--acc)"><h3 style="margin-top:0">Lo que viste con la Lupa</h3>${intel.map(t => `<p>${t}</p>`).join('')}</div>` : ''}
    ${p.char === 'inspector' ? `<div class="card"><h3 style="margin-top:0">🕵️ Inspección de sanidad</h3>${ui.inspected ? `<p>${ui.inspected}</p>` : canInspect ? `<p class="small mut">Una vez por partida: ver quién te atacó esta ronda.</p><button class="btn sec sm" data-act="inspect">Usar habilidad</button>` : '<p class="small mut">Ya usaste tu habilidad.</p>'}</div>` : ''}
    ${cand.map(j => `<div class="pill ${ui.vote === j ? 'on' : ''}" data-act="vote" data-i="${j}"><span>${name(j)}</span><span>${ui.vote === j ? '✔' : ''}</span></div>`).join('')}
    <div class="pill ${ui.vote === -1 ? 'on' : ''}" data-act="vote" data-i="-1"><span class="mut">No voto a nadie</span><span>${ui.vote === -1 ? '✔' : ''}</span></div>
    ${dock('Confirmar voto', 'castvote', ui.vote == null ? 'disabled' : '')}`;
}

function vVerdict() {
  const V = G.vote, p = V.accused != null ? G.players[V.accused] : null;
  const votes = G.players.map((q, j) => j).filter(j => V.count[j] > 0).sort((a, b) => V.count[b] - V.count[a]);
  let body;
  if (!p) body = `<div class="big">🤷</div><h1>Nadie fue acusado</h1><p class="mut">Empate o sin votos. Los saboteadores respiran tranquilos…</p>`;
  else if (V.verdict === 'sab') body = `<div class="big">🚨</div><h1>¡${name(V.accused)} era Saboteador!</h1><p class="mut">Le sacan las herramientas de sabotaje. Sigue cocinando y votando, pero su plato ya no cuenta para las estrellas.</p>`;
  else body = `<div class="big">😬</div><h1>${name(V.accused)} era Chef Leal</h1><p class="mut">Acusaron a un inocente. El caos en la cocina resta −1 al promedio del próximo plato.</p>`;
  const last = G.round + 1 >= ROUNDS || allCaught();
  return `${header()}<div class="hero">${body}</div>
    ${votes.length ? `<div class="card"><h3 style="margin-top:0">Votos recibidos</h3>${votes.map(j => `<div class="row"><span class="grow">${name(j)}</span><b>${V.count[j]}</b></div>`).join('')}</div>` : ''}
    <div class="card center"><div class="stars">${starRow()}</div></div>
    ${dock(last ? 'Ver el final 🏁' : 'Siguiente plato →', 'nextround')}`;
}

function vEnd() {
  const mvp = [...G.players.keys()].sort((a, b) => G.players[b].total - G.players[a].total);
  if (!isRoles()) {
    const top = G.players[mvp[0]].total, winners = mvp.filter(i => G.players[i].total === top);
    return `<div class="hero"><div class="big">🏆</div><p class="mut">Campe${winners.length > 1 ? 'ones' : 'ón'} de la final</p><h1>${winners.map(name).join(' y ')}</h1><p>${top} puntos</p></div>
      <div class="card">${standings()}</div>${endButtons()}`;
  }
  const leal = G.win === 'leal';
  return `<div class="hero"><div class="big">${leal ? '👨‍🍳⭐' : '🧂💀'}</div><h1>${leal ? 'Ganan los Chefs Leales' : 'Ganan los Saboteadores'}</h1><p class="mut">${esc(G.why)}</p>
    <div class="stars">${starRow()}</div></div>
    <div class="card"><h3 style="margin-top:0">Identidades reveladas</h3>${G.players.map((p, i) => `<div class="row" style="padding:5px 0"><span>${CHARS[p.char].e}</span><span class="grow">${name(i)} <span class="small mut">${CHARS[p.char].name}</span></span><span class="tag ${p.role === 'sab' ? 'sab' : 'ok'}">${p.role === 'sab' ? 'Saboteador' : 'Leal'}</span></div>`).join('')}</div>
    <div class="card"><h3 style="margin-top:0">👑 Chef de Oro (más puntos)</h3>${standings()}</div>${endButtons()}`;
}
const endButtons = () => `<button class="btn" data-act="again">Revancha con los mismos chefs</button><button class="btn sec" data-act="home">Volver al inicio</button>`;

function rulesHTML() {
  return `<div class="card"><div class="top"><h2 style="margin:0">📖 Cómo se juega</h2><button class="x" data-act="close">×</button></div>
  <p>Se juega con <b>un solo celular</b> que pasa de mano en mano. Cuando aparece “Pasale el celu a…”, solo esa persona mira.</p>
  <h3>Partida</h3><p>Son ${ROUNDS} platos: entrada, principal y postre. Cada plato tiene un tema que da puntos extra.</p>
  <h3>Tu turno</h3><p>1. Elegí <b>3 ingredientes</b> de tu despensa. Suman sus ★, el bonus del tema y +2 por cada maridaje.<br>2. Usá una herramienta (o ninguna). Todo se resuelve junto al final de la ronda y los ataques son anónimos.</p>
  <h3>Herramientas</h3>${Object.values(CARDS).map(c => `<p>${c.e} <b>${c.name}</b>: ${c.desc}</p>`).join('')}
  <h3>Personajes</h3>${Object.values(CHARS).map(c => `<p>${c.e} <b>${c.name}</b>: ${c.desc}${c.roles ? ' <span class="small mut">(solo modo roles)</span>' : ''}</p>`).join('')}
  <h3>2 a 4 jugadores · Duelo</h3><p>Todos contra todos. Gana quien sume más puntos.</p>
  <h3>5 a 10 jugadores · Roles ocultos</h3><p>Hay 1 saboteador (5–6 chefs), 2 (7–8) o 3 (9–10). Los saboteadores reciben 3 herramientas y usan hasta 2.</p>
  <p>Si el promedio de los platos es ${STAR_AVG} o más, la cocina gana una ⭐. Los <b>Leales</b> ganan con ${STARS_NEEDED} estrellas o si desenmascaran a todos los saboteadores. Si no, ganan los <b>Saboteadores</b>.</p>
  <p>Después de cada plato: debate y voto secreto. El más votado (sin empate) queda expuesto. Si era leal, el caos resta −1 al próximo promedio.</p>
  <h3>Nadie queda afuera</h3><p>Al saboteador descubierto se le sacan las herramientas de sabotaje, pero sigue jugando y votando. Si tu plato saca 3 o menos, en la ronda siguiente sos <b>Crítico Fantasma</b> y podés regalar +1 a otro chef.</p>
  <button class="btn" data-act="close">Entendido</button></div>`;
}
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = html; m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-act="close"]')) m.remove(); }); document.body.appendChild(m); }

// ───────── Eventos ─────────
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name != null) { ui.names[+t.dataset.name] = t.value; localStorage.setItem(NAMES_KEY, JSON.stringify(ui.names));
    const n = ui.names.filter(s => s.trim()).length; $('#modeinfo').innerHTML = modeInfo(n, n >= 5 ? 'roles' : 'duel');
    document.querySelector('[data-act="start"]').disabled = n < 2; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'timed') ui.timed = t.checked;
  if (t.dataset.tool != null) {
    const i = order()[G.idx], k = +t.dataset.tool, A = G.turn.actions[i].filter(x => x.k !== k);
    if (t.value !== '') A.push({ k, card: G.turn.hands[i][k], t: +t.value });
    G.turn.actions[i] = A; save(); updatePreview();
  }
  if (t.dataset.gift != null) { const i = order()[G.idx]; G.turn.gifts[i] = t.value === '' ? null : +t.value; save(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.closest('.modal') && el.dataset.act === 'close') return;
  const act = el.dataset.act;
  switch (act) {
    case 'add': ui.names.push(''); render(); setTimeout(() => { const ins = document.querySelectorAll('[data-name]'); ins[ins.length - 1].focus(); }); break;
    case 'del': ui.names.splice(+el.dataset.i, 1); localStorage.setItem(NAMES_KEY, JSON.stringify(ui.names)); render(); break;
    case 'rules': modal(rulesHTML()); break;
    case 'resume': try { G = JSON.parse(localStorage.getItem(KEY)); } catch (err) {} render(); break;
    case 'start': {
      const names = ui.names.map(s => s.trim()).filter(Boolean);
      const dup = names.find((s, i) => names.findIndex(x => x.toLowerCase() === s.toLowerCase()) !== i);
      if (dup) { alert(`Hay dos chefs llamados “${dup}”. Cambiá uno para no confundirse.`); return; }
      newGame(names, ui.timed); render(); break;
    }
    case 'reveal': G.hand = false; save(); render(); break;
    case 'next': // fin de ver rol
      if (G.idx + 1 < G.players.length) { G.idx++; G.hand = true; save(); render(); } else { startRound(); render(); }
      break;
    case 'ing': {
      const i = order()[G.idx], P = G.turn.picks[i], id = el.dataset.id, k = P.indexOf(id);
      if (k >= 0) P.splice(k, 1); else if (P.length < 3) P.push(id); else { P.shift(); P.push(id); }
      document.querySelectorAll('.ing').forEach(x => x.classList.toggle('on', P.includes(x.dataset.id)));
      save(); updatePreview(); break;
    }
    case 'serve': clearInterval(tick); serve(); break;
    case 'debate': ui.debate = null; G.phase = 'debate'; save(); render(); break;
    case 'tovote': G.phase = 'vote'; G.idx = 0; G.hand = true; G.votes = []; ui.vote = null; ui.inspected = null; save(); render(); break;
    case 'vote': ui.vote = +el.dataset.i; render(); break;
    case 'inspect': {
      const i = G.idx, att = [...new Set(G.res.attackers[i])];
      G.players[i].ability = true; save();
      ui.inspected = att.length ? `Te atacaron: <b>${att.map(name).join(', ')}</b>.` : 'Nadie te atacó esta ronda.'; render(); break;
    }
    case 'castvote':
      G.votes[G.idx] = ui.vote === -1 ? null : ui.vote; ui.vote = null; ui.inspected = null;
      if (G.idx + 1 < G.players.length) { G.idx++; G.hand = true; save(); render(); } else { tallyVotes(); render(); }
      break;
    case 'nextround': nextRound(); render(); break;
    case 'again': { const names = G.players.map(p => p.name); newGame(shuffle(names), G.timed); render(); break; }
    case 'home': localStorage.removeItem(KEY); G = null; render(); break;
    case 'menu':
      modal(`<div class="card"><div class="top"><h2 style="margin:0">Menú</h2><button class="x" data-act="close">×</button></div>
        <button class="btn sec" data-act="rules2">📖 Cómo se juega</button>
        <button class="btn bad" data-act="quit">Abandonar partida</button></div>`); break;
    case 'rules2': document.querySelector('.modal').remove(); modal(rulesHTML()); break;
    case 'quit': if (confirm('¿Abandonar la partida? Se pierde el progreso.')) { document.querySelector('.modal').remove(); localStorage.removeItem(KEY); G = null; render(); } break;
  }
});

render();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
